  <circle cx="23" cy="3" r="1.5" fill="none" stroke="#d0cbc2" stroke-width="1.5"/>
  <!-- Day grid: 4x7 dots -->
  <g fill="#2d2926">
    <circle cx="6" cy="17" r="1.2"/><circle cx="10" cy="17" r="1.2"/><circle cx="14" cy="17" r="1.2"/><circle cx="18" cy="17" r="1.2"/><circle cx="22" cy="17" r="1.2"/><circle cx="26" cy="17" r="1.2"/>
    <circle cx="6" cy="21" r="1.2"/><circle cx="10" cy="21" r="1.2"/><circle cx="14" cy="21" r="1.2"/><circle cx="18" cy="21" r="1.2"/><circle cx="22" cy="21" r="1.2"/><circle cx="26" cy="21" r="1.2"/>
    <circle cx="6" cy="25" r="1.2"/><circle cx="10" cy="25" r="1.2"/><circle cx="14" cy="25" r="1.2"/><circle cx="18" cy="25" r="1.2"/><circle cx="22" cy="25" r="1.2"/><circle cx="26" cy="25" r="1.2"/>
  </g>
</svg>
